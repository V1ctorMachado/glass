<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia de Jogo</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('diadejogo-tema'); } catch (e) { }
            if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <style>
        :root {
            --bg: #fafafa;
            --card: #fff;
            --input: #fff;
            --text: #1a1a1a;
            --muted: #6b6b6b;
            --line: #e7e7e7;
            --yellow: #e0a800;
            --blue: #2563eb;
            --red: #dc2626;
            --warn: #b45309;
            color-scheme: light;
        }

        :root[data-theme="escuro"] {
            --bg: #111214;
            --card: #1a1b1e;
            --input: #141518;
            --text: #ececec;
            --muted: #9a9a9a;
            --line: #2c2d31;
            --yellow: #f5c400;
            --blue: #3b82f6;
            --red: #ef4444;
            --warn: #f59e0b;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            transition: background .2s, color .2s
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 5
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 16px
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 56px
        }

        .brand {
            font-weight: 700;
            letter-spacing: .08em;
            font-size: 14px
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto
        }

        nav {
            display: flex;
            gap: 2px
        }

        nav button {
            background: none;
            border: none;
            padding: 16px 12px 14px;
            font: inherit;
            font-size: 14px;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap
        }

        nav button.active {
            color: var(--text);
            border-bottom-color: var(--text)
        }

        main {
            padding: 28px 16px 64px
        }

        h2 {
            font-size: 20px;
            margin-bottom: 2px
        }

        h3 {
            font-size: 15px;
            margin-bottom: 12px
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            margin-bottom: 16px
        }

        .team {
            border-top: 4px solid;
            margin-bottom: 0
        }

        .team.YELLOW {
            border-top-color: var(--yellow)
        }

        .team.BLUE {
            border-top-color: var(--blue)
        }

        .team.RED {
            border-top-color: var(--red)
        }

        .team h3 {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .list {
            list-style: none
        }

        .list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .list li:last-child {
            border-bottom: none
        }

        .tag {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .scroll {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 9px 8px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap
        }

        th {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .num {
            text-align: right
        }

        th.on,
        td.on {
            color: var(--text);
            font-weight: 700
        }

        input,
        select {
            font: inherit;
            font-size: 14px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--input);
            color: var(--text)
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--text)
        }

        .btn {
            font: inherit;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--text);
            background: var(--text);
            color: var(--bg);
            cursor: pointer;
            display: inline-block;
            white-space: nowrap
        }

        .btn.ghost {
            background: var(--card);
            color: var(--text);
            border-color: var(--line)
        }

        .btn.ghost:hover {
            border-color: var(--text)
        }

        .btn.small {
            padding: 4px 10px;
            font-size: 13px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .between {
            justify-content: space-between
        }

        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            border: 1px solid var(--line);
            color: var(--muted)
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px
        }

        .empty {
            color: var(--muted);
            padding: 8px 0;
            font-size: 14px
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .tabs button {
            font: inherit;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            cursor: pointer;
            color: var(--muted)
        }

        .tabs button.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text)
        }

        .checks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 6px
        }

        .checks label {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px
        }

        .flag {
            color: var(--warn);
            font-size: 13px
        }

        .form {
            font-family: ui-monospace, Menlo, monospace;
            letter-spacing: .12em
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .field span {
            font-size: 12px;
            color: var(--muted)
        }

        .note {
            font-size: 13px;
            color: var(--muted);
            text-transform: none;
            letter-spacing: 0
        }

        .score {
            font-size: 18px;
            font-weight: 700;
            margin: 0 8px
        }
    </style>
</head>

<body>

    <header>
        <div class="wrap top">
            <div class="brand">DIA DE JOGO</div>
            <div class="navbar">
                <nav id="nav">
                    <button data-view="teams">Times</button>
                    <button data-view="schedule">Agenda</button>
                    <button data-view="rankings">Rankings</button>
                    <button data-view="watch">Em observação</button>
                    <button data-view="admin">Admin</button>
                </nav>
                <button class="btn ghost small" data-act="theme" id="themeBtn">Tema</button>
            </div>
        </div>
    </header>

    <main class="wrap" id="app">
        <p class="empty">Carregando...</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        /* ========== CONFIGURAÇÃO DO FIREBASE (cole os dados do seu projeto) ========== */
        const firebaseConfig = {
            apiKey: "AIzaSyDxRoa5LA8yK68GjnV0ADUkpDitZZPSRDs",
            authDomain: "://firebaseapp.com",
            projectId: "futglass",
            storageBucket: "futglass.firebasestorage.app",
            messagingSenderId: "477353498381",
            appId: "1:477353498381:web:8e1e8d442715fa65360244"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);

        // EXPORTAR O DB É FUNDAMENTAL: Sem isso você não consegue ler ou salvar dados
        export const db = getFirestore(app);

        /* ========== Constantes ========== */
        const TEAMS = ['YELLOW', 'BLUE', 'RED'];
        const NOME = { YELLOW: 'AMARELO', BLUE: 'AZUL', RED: 'VERMELHO' };
        const RES = { W: 'V', D: 'E', L: 'D' };
        const DIAS_ALEATORIO = 45;
        const PADRAO = { teamSize: 6, pairMemory: 8, watchWindow: 5, minGames: 3 };

        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

        /* ========== Tema ========== */
        function aplicarTema(t) {
            document.documentElement.dataset.theme = t;
            try { localStorage.setItem('diadejogo-tema', t); } catch (e) { }
            $('#themeBtn').textContent = t === 'escuro' ? 'Tema claro' : 'Tema escuro';
        }
        aplicarTema(document.documentElement.dataset.theme);

        /* ========== Estado ========== */
        let state = { settings: { ...PADRAO }, players: [], days: [], matches: [] };
        const loaded = { players: false, days: false, matches: false, config: false };
        let loadError = null, authUser = null, isAdmin = false, authMsg = '';
        let view = 'teams', openDay = null, rankTab = 'goals';

        if (!firebaseConfig.projectId) {
            $('#app').innerHTML = `<div class="card"><h3>Configuração pendente</h3><p class="sub" style="margin:0">Preencha o objeto <b>firebaseConfig</b> no código com os dados do seu projeto Firebase para começar.</p></div>`;
            throw new Error('Firebase não configurado');
        }

        const fb = initializeApp(firebaseConfig);
        const db = getFirestore(fb);
        const auth = getAuth(fb);

        ['players', 'days', 'matches'].forEach(col => onSnapshot(collection(db, col),
            snap => { state[col] = snap.docs.map(d => ({ ...d.data(), id: d.id })); loaded[col] = true; render(); },
            err => { loadError = err.code || err.message; render(); }));
        onSnapshot(doc(db, 'config', 'settings'),
            snap => { state.settings = { ...PADRAO, ...(snap.exists() ? snap.data() : {}) }; loaded.config = true; render(); },
            err => { loadError = err.code || err.message; render(); });

        onAuthStateChanged(auth, async user => {
            authUser = user; isAdmin = false; authMsg = '';
            if (user) {
                try {
                    const s = await getDoc(doc(db, 'admins', user.uid));
                    isAdmin = s.exists();
                    if (!isAdmin) authMsg = 'Este usuário não tem permissão de administrador.';
                } catch (e) { authMsg = 'Não foi possível verificar a permissão de administrador.'; }
            }
            render();
        });

        /* ========== Gravação ========== */
        const falha = e => alert('Erro ao salvar: ' + (e.code || e.message));
        const limpo = o => JSON.parse(JSON.stringify(o));
        const put = (col, o) => setDoc(doc(db, col, o.id), limpo(o)).catch(falha);
        const del = (col, id) => deleteDoc(doc(db, col, id)).catch(falha);
        async function lote(ops) {
            try {
                for (let i = 0; i < ops.length; i += 450) {
                    const b = writeBatch(db);
                    ops.slice(i, i + 450).forEach(([tipo, col, o]) => tipo === 'set' ? b.set(doc(db, col, o.id), limpo(o)) : b.delete(doc(db, col, o)));
                    await b.commit();
                }
            } catch (e) { falha(e); }
        }

        /* ========== Utilidades ========== */
        const P = id => state.players.find(p => p.id === id);
        const M = id => state.matches.find(m => m.id === id);
        const pname = id => P(id)?.name || 'Desconhecido';
        const dayById = id => state.days.find(d => d.id === id);
        const curDay = () => dayById(openDay);
        const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
        const fmtDate = s => new Date(s + 'T00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
        const sortedDays = () => state.days.slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
        const dayMatches = dayId => state.matches.filter(m => m.dayId === dayId).sort((a, b) => a.created - b.created);
        const pct = x => Math.round(x * 100) + '%';
        const dot = t => `<span class="dot" style="background:var(--${t.toLowerCase()})"></span>`;
        const teamLabel = t => dot(t) + NOME[t];
        const modeLabel = m => m === 'balanced' ? 'Balanceado por estatísticas' : 'Aleatório';

        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
        function roster(day, team) { if (!day.teams) return []; const r = day.teams[team].slice(); const gk = day.gk && day.gk[team]; if (gk) r.unshift(gk); return r; }
        function score(m) { return [m.events.filter(e => e.team === m.home).length, m.events.filter(e => e.team === m.away).length]; }
        function currentGKs() { const g = {}; TEAMS.forEach(t => { const p = state.players.find(x => x.pos === 'GK' && x.active && x.team === t); g[t] = p ? p.id : null; }); return g; }
        function dayStatus(d) {
            const n = state.matches.filter(m => m.dayId === d.id && m.done).length;
            return n ? `${n} partida${n > 1 ? 's' : ''} jogada${n > 1 ? 's' : ''}` : d.teams ? 'Times sorteados' : 'Agendado';
        }

        /* ========== Rodízio: quem ganha fica ========== */
        function streakOf(ms, idx, t) { let n = 0; for (let i = idx; i >= 0; i--) { if (ms[i].home === t || ms[i].away === t) n++; else break; } return n; }
        function plano(m) {
            const ms = dayMatches(m.dayId), idx = ms.findIndex(x => x.id === m.id);
            const [h, a] = score(m), waiting = TEAMS.find(t => t !== m.home && t !== m.away);
            if (h !== a) { const stay = h > a ? m.home : m.away; return { stay, leave: stay === m.home ? m.away : m.home, waiting, motivo: 'vitória' }; }
            const sh = streakOf(ms, idx, m.home), sa = streakOf(ms, idx, m.away);
            if (sh === sa) return { tie: true, waiting };
            const leave = sh > sa ? m.home : m.away;
            return { stay: leave === m.home ? m.away : m.home, leave, waiting, motivo: 'empate' };
        }
        function novaPartida(dayId, home, away) { return { id: uid(), dayId, home, away, events: [], done: false, created: Date.now() }; }
        function canReopen(m, ms) {
            const idx = ms.findIndex(x => x.id === m.id);
            if (!m.done) return false;
            const next = ms[idx + 1];
            if (!next) return true;
            return idx + 1 === ms.length - 1 && !next.done && next.events.length === 0;
        }

        /* ========== Estatísticas ========== */
        function computeStats() {
            const s = {};
            state.players.forEach(p => s[p.id] = { id: p.id, name: p.name, pos: p.pos, active: p.active, games: 0, w: 0, d: 0, l: 0, goals: 0, assists: 0, log: [] });
            const order = {}; sortedDays().forEach((d, i) => order[d.id] = i);
            state.matches
                .filter(m => m.done && dayById(m.dayId)?.teams)
                .sort((a, b) => (order[a.dayId] - order[b.dayId]) || (a.created - b.created))
                .forEach(m => {
                    const day = dayById(m.dayId), [hg, ag] = score(m), ga = {};
                    m.events.forEach(e => {
                        if (s[e.scorer]) { s[e.scorer].goals++; ga[e.scorer] = (ga[e.scorer] || 0) + 1; }
                        if (e.assist && s[e.assist]) { s[e.assist].assists++; ga[e.assist] = (ga[e.assist] || 0) + 1; }
                    });
                    [[m.home, hg, ag], [m.away, ag, hg]].forEach(([t, f, a]) => {
                        const r = f > a ? 'W' : f < a ? 'L' : 'D';
                        roster(day, t).forEach(id => { const x = s[id]; if (!x) return; x.games++; x[r.toLowerCase()]++; x.log.push({ r, ga: ga[id] || 0 }); });
                    });
                });
            return s;
        }
        const PRIOR = 1.3, K = 5;
        function rating(x) {
            if (!x) return PRIOR;
            const base = (3 * x.w + x.d + PRIOR * K) / (x.games + K);
            const contrib = (x.goals + 0.7 * x.assists) / (x.games + K);
            return base + 0.4 * contrib;
        }
        function strength(day, t, st) { const r = roster(day, t); return r.length ? r.reduce((a, id) => a + rating(st[id]), 0) / r.length : 0; }

        /* ========== Sorteio ========== */
        function firstPlayed() { return state.matches.filter(m => m.done).map(m => dayById(m.dayId)?.date).filter(Boolean).sort()[0] || null; }
        function daysSince(date) { return Math.floor((new Date(todayStr() + 'T00:00') - new Date(date + 'T00:00')) / 864e5); }
        function currentMode() { const f = firstPlayed(); return f && daysSince(f) >= DIAS_ALEATORIO ? 'balanced' : 'random'; }
        function modeInfo() {
            const f = firstPlayed();
            if (!f) return `Próximo sorteio: aleatório. O período aleatório dura ${DIAS_ALEATORIO} dias a partir da primeira partida registrada.`;
            const left = DIAS_ALEATORIO - daysSince(f);
            return left > 0 ? `Próximo sorteio: aleatório. O sorteio balanceado passa a ser obrigatório em ${left} dia${left > 1 ? 's' : ''}.`
                : `Próximo sorteio: balanceado por estatísticas (obrigatório após ${DIAS_ALEATORIO} dias).`;
        }
        const pk = (a, b) => a < b ? a + '|' + b : b + '|' + a;
        function pairCounts(excludeId) {
            const c = {};
            sortedDays().filter(d => d.teams && d.id !== excludeId).slice(-state.settings.pairMemory).forEach(d =>
                TEAMS.forEach(t => { const a = d.teams[t]; for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) { const k = pk(a[i], a[j]); c[k] = (c[k] || 0) + 1; } }));
            return c;
        }
        function deal(ids) { const t = { YELLOW: [], BLUE: [], RED: [] }; ids.forEach((id, i) => t[TEAMS[i % 3]].push(id)); return t; }
        function balancedSplit(ids, dayId, gk) {
            const st = computeStats(), r = {}, gr = {};
            ids.forEach(id => r[id] = rating(st[id]));
            TEAMS.forEach(t => gr[t] = gk[t] ? rating(st[gk[t]]) : PRIOR);
            const pc = pairCounts(dayId);
            const cost = t => {
                const sums = TEAMS.map(x => t[x].reduce((a, id) => a + r[id], 0) + gr[x]);
                let rep = 0;
                TEAMS.forEach(x => { const a = t[x]; for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) rep += pc[pk(a[i], a[j])] || 0; });
                return (Math.max(...sums) - Math.min(...sums)) * 10 + rep * 0.5;
            };
            let best = null, bc = Infinity;
            for (let n = 0; n < 40; n++) {
                const t = deal(shuffle(ids.slice()));
                let c = cost(t), improved = true;
                while (improved) {
                    improved = false;
                    for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) {
                        const A = t[TEAMS[a]], B = t[TEAMS[b]];
                        for (let i = 0; i < A.length; i++) for (let j = 0; j < B.length; j++) {
                            [A[i], B[j]] = [B[j], A[i]];
                            const nc = cost(t);
                            if (nc < c - 1e-9) { c = nc; improved = true; } else { [A[i], B[j]] = [B[j], A[i]]; }
                        }
                    }
                }
                if (c < bc) { bc = c; best = t; }
            }
            return best;
        }

        /* ========== Componentes ========== */
        function teamCard(day, t, extra = '') {
            const gk = day.gk && day.gk[t];
            return `<div class="card team ${t}">
    <h3><span>${NOME[t]}</span><span class="tag">${extra || (day.teams[t].length + (gk ? 1 : 0)) + ' jogadores'}</span></h3>
    <ul class="list">
      ${gk ? `<li><span>${esc(pname(gk))}</span><span class="tag">Goleiro</span></li>` : '<li><span class="flag">Sem goleiro</span></li>'}
      ${day.teams[t].map(id => `<li><span>${esc(pname(id))}</span></li>`).join('')}
    </ul></div>`;
        }
        function matchLine(m) {
            const [h, a] = score(m), sc = {};
            m.events.forEach(e => sc[e.scorer] = (sc[e.scorer] || 0) + 1);
            const names = Object.entries(sc).map(([id, n]) => esc(pname(id)) + (n > 1 ? ` (${n})` : '')).join(', ');
            return `<li style="display:block"><div>${teamLabel(m.home)} <b>&nbsp;${h} x ${a}&nbsp;</b> ${teamLabel(m.away)}</div>${names ? `<div class="note">Gols: ${names}</div>` : ''}</li>`;
        }
        function dayResults(day) {
            const ms = dayMatches(day.id).filter(m => m.done);
            return ms.length ? `<div class="card"><h3>Resultados</h3><ul class="list">${ms.map(matchLine).join('')}</ul></div>` : '';
        }
        function rotacaoTexto(m) {
            const p = plano(m);
            if (p.tie) return 'Empate entre times que entraram juntos. O administrador define quem sai.';
            return `${NOME[p.stay]} permanece, ${NOME[p.leave]} sai e ${NOME[p.waiting]} entra (${p.motivo}).`;
        }

        /* ========== Telas públicas ========== */
        function viewTeams() {
            const t = todayStr(), drawn = sortedDays().filter(d => d.teams);
            const day = drawn.find(d => d.date >= t) || drawn[drawn.length - 1];
            const next = sortedDays().find(d => d.date >= t && !d.teams);
            let h = '<h2>Times</h2>';
            if (!day) return h + `<p class="sub">Nenhum time sorteado ainda.${next ? ' Próximo dia de jogo: ' + fmtDate(next.date) + '.' : ''}</p>`;
            h += `<p class="sub">${fmtDate(day.date)}${day.time ? ' às ' + esc(day.time) : ''}${day.place ? ' - ' + esc(day.place) : ''} &middot; Sorteio: ${modeLabel(day.mode)}</p>`;
            const live = dayMatches(day.id).find(m => !m.done);
            if (live) {
                const [hg, ag] = score(live), fora = TEAMS.find(x => x !== live.home && x !== live.away);
                h += `<div class="card"><div class="row between"><div>${teamLabel(live.home)}<span class="score">${hg} x ${ag}</span>${teamLabel(live.away)}</div><span class="pill">Em andamento</span></div><p class="note" style="margin-top:6px">Aguardando: ${NOME[fora]}</p></div>`;
            }
            h += `<div class="grid3">${TEAMS.map(x => teamCard(day, x)).join('')}</div>`;
            h += dayResults(day);
            if (next && next.date > day.date) h += `<p class="sub">Próximo dia de jogo: ${fmtDate(next.date)} (times ainda não sorteados).</p>`;
            return h;
        }

        function viewSchedule() {
            const t = todayStr(), ds = sortedDays();
            const up = ds.filter(d => d.date >= t), past = ds.filter(d => d.date < t).reverse();
            return `<h2>Agenda</h2><p class="sub">Próximos dias de jogo e resultados anteriores.</p>
  <div class="card"><h3>Próximos</h3>${up.length ? `<ul class="list">${up.map(d => `<li><span>${fmtDate(d.date)}${d.time ? ' às ' + esc(d.time) : ''}${d.place ? ' - ' + esc(d.place) : ''}</span><span class="tag">${dayStatus(d)}</span></li>`).join('')}</ul>` : '<p class="empty">Nenhum dia de jogo agendado.</p>'}</div>
  <div class="card"><h3>Anteriores</h3>${past.length ? past.map(d => {
                const ms = dayMatches(d.id).filter(m => m.done);
                return `<div style="margin-bottom:16px"><div style="font-weight:600">${fmtDate(d.date)}</div>${ms.length ? `<ul class="list">${ms.map(matchLine).join('')}</ul>` : '<p class="empty">Nenhum resultado registrado.</p>'}</div>`;
            }).join('') : '<p class="empty">Nenhum dia de jogo anterior.</p>'}</div>`;
        }

        function viewRankings() {
            const st = Object.values(computeStats()).filter(x => x.games > 0), min = state.settings.minGames;
            const tabs = [['goals', 'Gols'], ['assists', 'Assistências'], ['ga', 'Gols + Assistências'], ['win', 'Taxa de vitórias']];
            let rows;
            if (rankTab === 'win') rows = st.filter(x => x.games >= min).map(x => ({ ...x, v: x.w / x.games })).sort((a, b) => b.v - a.v || b.games - a.games);
            else rows = st.map(x => ({ ...x, v: rankTab === 'goals' ? x.goals : rankTab === 'assists' ? x.assists : x.goals + x.assists }))
                .filter(x => x.v > 0).sort((a, b) => b.v - a.v || a.games - b.games || a.name.localeCompare(b.name));
            let rank = 0, prev = null;
            rows.forEach((x, i) => { if (x.v !== prev) { rank = i + 1; prev = x.v; } x.rank = rank; });
            const on = k => rankTab === k ? 'on' : '';
            return `<h2>Rankings</h2><p class="sub">Considera apenas partidas encerradas.${rankTab === 'win' ? ` Mínimo de ${min} jogos.` : ''}</p>
  <div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${rankTab === k ? 'active' : ''}">${l}</button>`).join('')}</div>
  <div class="card scroll">${rows.length ? `<table><thead><tr><th>#</th><th>Jogador</th><th class="num">J</th><th class="num ${on('goals')}">G</th><th class="num ${on('assists')}">A</th><th class="num ${on('ga')}">G+A</th><th class="num">V-E-D</th><th class="num ${on('win')}">Vit.</th></tr></thead><tbody>
  ${rows.map(x => `<tr><td>${x.rank}</td><td>${esc(x.name)}${x.pos === 'GK' ? ' <span class="tag">Goleiro</span>' : ''}</td><td class="num">${x.games}</td><td class="num ${on('goals')}">${x.goals}</td><td class="num ${on('assists')}">${x.assists}</td><td class="num ${on('ga')}">${x.goals + x.assists}</td><td class="num">${x.w}-${x.d}-${x.l}</td><td class="num ${on('win')}">${pct(x.w / x.games)}</td></tr>`).join('')}
  </tbody></table>` : '<p class="empty">Sem dados ainda.</p>'}</div>`;
        }

        function viewWatch() {
            const s = state.settings, N = s.watchWindow;
            const rows = Object.values(computeStats()).filter(x => x.pos === 'FIELD' && x.active && x.games >= s.minGames).map(x => {
                const last = x.log.slice(-N);
                const w = last.filter(g => g.r === 'W').length, d = last.filter(g => g.r === 'D').length;
                const rate = w / last.length, ga = last.reduce((a, g) => a + g.ga, 0);
                let streak = 0; for (let i = x.log.length - 1; i >= 0 && x.log[i].r === 'L'; i--) streak++;
                const flags = [];
                if (streak >= 3) flags.push(`${streak} derrotas seguidas`);
                if (rate < 0.25) flags.push('Baixa taxa de vitórias recente');
                if (ga === 0 && last.length >= N) flags.push(`Sem gols ou assistências nos últimos ${N} jogos`);
                return { ...x, last, rate, ga, flags, ppg: (3 * w + d) / last.length };
            }).sort((a, b) => b.flags.length - a.flags.length || a.ppg - b.ppg);
            const flagged = rows.filter(r => r.flags.length).length;
            return `<h2>Em observação</h2><p class="sub">Desempenho recente nos últimos ${N} jogos. O jogador é sinalizado com 3 ou mais derrotas seguidas, taxa de vitórias recente abaixo de 25% ou nenhum gol ou assistência nos últimos ${N} jogos. Considera jogadores de linha com pelo menos ${s.minGames} jogos.</p>
  <div class="card scroll"><h3>${flagged} jogador${flagged === 1 ? '' : 'es'} sinalizado${flagged === 1 ? '' : 's'}</h3>${rows.length ? `<table><thead><tr><th>Jogador</th><th>Últimos ${N}</th><th class="num">Vit. recente</th><th class="num">G+A</th><th class="num">Vit. geral</th><th>Situação</th></tr></thead><tbody>
  ${rows.map(x => `<tr><td>${esc(x.name)}</td><td class="form">${x.last.map(g => RES[g.r]).join(' ')}</td><td class="num">${pct(x.rate)}</td><td class="num">${x.ga}</td><td class="num">${pct(x.w / x.games)}</td><td>${x.flags.length ? `<span class="flag">${x.flags.join('; ')}</span>` : '<span class="tag">Normal</span>'}</td></tr>`).join('')}
  </tbody></table>` : '<p class="empty">Ainda não há jogos suficientes.</p>'}</div>`;
        }

        /* ========== Telas do administrador ========== */
        function viewAdmin() {
            if (!isAdmin) {
                if (authUser) return `<h2>Admin</h2><div class="card" style="max-width:420px"><p class="flag" style="margin-bottom:12px">${esc(authMsg || 'Verificando permissão...')}</p><button class="btn ghost" data-act="logout">Sair</button></div>`;
                return `<h2>Admin</h2><p class="sub">Área restrita para agendar dias de jogo e registrar resultados.</p>
      <div class="card" style="max-width:420px"><form data-form="login" class="fields" style="grid-template-columns:1fr">
        <label class="field"><span>E-mail</span><input id="lEmail" type="email" autocomplete="username" required></label>
        <label class="field"><span>Senha</span><input id="lSenha" type="password" autocomplete="current-password" required></label>
        <button class="btn">Entrar</button></form><p id="loginErr" class="flag" style="margin-top:8px"></p></div>`;
            }
            const d = curDay();
            if (d) return dayPanel(d);
            return `<div class="row between"><h2>Admin</h2><button class="btn ghost small" data-act="logout">Sair</button></div><p class="sub">${modeInfo()}</p>` + scheduleAdmin() + playersAdmin() + settingsAdmin();
        }

        function scheduleAdmin() {
            const ds = sortedDays().reverse();
            return `<div class="card"><h3>Dias de jogo</h3>
    <form data-form="addDay" class="row" style="margin-bottom:12px"><input type="date" id="dDate" required value="${todayStr()}"><input type="time" id="dTime"><input id="dPlace" placeholder="Local"><button class="btn">Agendar</button></form>
    ${ds.length ? `<ul class="list">${ds.map(d => `<li><span>${fmtDate(d.date)}${d.time ? ' ' + esc(d.time) : ''} <span class="tag">&nbsp;${dayStatus(d)}</span></span><button class="btn ghost small" data-act="openDay" data-id="${d.id}">Gerenciar</button></li>`).join('')}</ul>` : '<p class="empty">Nenhum dia de jogo agendado.</p>'}
  </div>`;
        }

        function attText(day) {
            const n = day.attendees.length, target = state.settings.teamSize * 3;
            return `${n} selecionados, meta de ${target} (${state.settings.teamSize} por time).${n % 3 ? ' Os times ficarão desiguais.' : ''}`;
        }

        function dayPanel(day) {
            const st = computeStats();
            const field = state.players.filter(p => p.pos === 'FIELD' && (p.active || day.attendees.includes(p.id))).sort((a, b) => a.name.localeCompare(b.name));
            const ms = dayMatches(day.id), locked = ms.length > 0;
            const gkMissing = TEAMS.filter(t => !currentGKs()[t]);
            let h = `<div class="row between" style="margin-bottom:20px"><div><h2>${fmtDate(day.date)}</h2><p class="sub" style="margin:0">${[day.time, day.place].filter(Boolean).map(esc).join(' - ') || 'Sem horário ou local definido'}</p></div>
    <div class="row"><button class="btn ghost" data-act="closeDay">Voltar</button>${locked ? '' : `<button class="btn ghost" data-act="delDay" data-id="${day.id}">Excluir dia</button>`}</div></div>`;

            h += `<div class="card"><h3>Presença</h3><p class="sub" id="attCount">${attText(day)}</p>
    ${locked ? '<p class="sub">A presença está bloqueada porque já existem partidas registradas.</p>' : '<div class="row" style="margin-bottom:12px"><button class="btn ghost small" data-act="attAll">Selecionar todos</button><button class="btn ghost small" data-act="attNone">Limpar</button></div>'}
    <div class="checks">${field.map(p => `<label><input type="checkbox" data-chg="att" data-id="${p.id}" ${day.attendees.includes(p.id) ? 'checked' : ''} ${locked ? 'disabled' : ''}>${esc(p.name)}</label>`).join('') || '<p class="empty">Nenhum jogador de linha cadastrado.</p>'}</div>
    <p class="sub" style="margin:12px 0 0">Os goleiros são fixos em seus times e não participam do sorteio.</p></div>`;

            h += `<div class="card"><h3>Sorteio</h3><p class="sub">${modeInfo()}</p>
    ${gkMissing.length ? `<p class="flag" style="margin-bottom:12px">Sem goleiro definido para: ${gkMissing.map(t => NOME[t]).join(', ')}.</p>` : ''}
    ${locked ? '<p class="sub" style="margin:0">O sorteio está bloqueado porque já existem partidas registradas neste dia.</p>' : `<button class="btn" data-act="draw">${day.teams ? 'Sortear novamente' : 'Sortear times'}</button>`}</div>`;

            if (day.teams) {
                h += `<p class="sub">Sorteio: ${modeLabel(day.mode)}. Força é a média da avaliação dos jogadores.</p>
      <div class="grid3">${TEAMS.map(t => teamCard(day, t, 'Força ' + strength(day, t, st).toFixed(2))).join('')}</div>`;

                const live = ms.find(m => !m.done), last = ms[ms.length - 1];
                const tiePending = last && last.done && plano(last).tie;
                h += `<div class="card"><h3>Partidas</h3><p class="sub">Regra de rodízio: quem vence permanece e enfrenta o time que estava fora. Em caso de empate, sai o time que está há mais partidas seguidas em campo. Se os dois entraram juntos, o administrador escolhe quem sai.</p>`;
                if (tiePending) {
                    h += `<p style="margin-bottom:8px">Empate na partida entre ${NOME[last.home]} e ${NOME[last.away]}. Quem sai?</p><div class="row">
        <button class="btn ghost" data-act="leave" data-mid="${last.id}" data-team="${last.home}">Sai ${NOME[last.home]}</button>
        <button class="btn ghost" data-act="leave" data-mid="${last.id}" data-team="${last.away}">Sai ${NOME[last.away]}</button></div>`;
                } else if (!live) {
                    let dh = 'YELLOW', da = 'BLUE';
                    if (last && last.done) { const p = plano(last); dh = p.stay; da = p.waiting; }
                    h += `<div class="row"><select id="mHome">${TEAMS.map(t => `<option value="${t}" ${t === dh ? 'selected' : ''}>${NOME[t]}</option>`).join('')}</select><span class="tag">x</span>
        <select id="mAway">${TEAMS.map(t => `<option value="${t}" ${t === da ? 'selected' : ''}>${NOME[t]}</option>`).join('')}</select>
        <button class="btn" data-act="addMatch">${ms.length ? 'Nova partida' : 'Iniciar primeira partida'}</button></div>`;
                } else {
                    h += `<p class="note">Partida em andamento. A próxima é criada automaticamente ao encerrar.</p>`;
                }
                h += '</div>';
                h += ms.map((m, i) => matchAdmin(m, day, i, ms)).reverse().join('');
            }
            return h;
        }

        function matchAdmin(m, day, i, ms) {
            const [hg, ag] = score(m), isLast = i === ms.length - 1;
            const goalForm = t => {
                const opts = roster(day, t).map(id => `<option value="${id}">${esc(pname(id))}</option>`).join('');
                return `<div class="row" style="margin-top:8px"><span class="tag" style="width:86px">${dot(t)}${NOME[t]}</span>
      <select id="sc-${m.id}-${t}"><option value="">Autor do gol</option>${opts}</select>
      <select id="as-${m.id}-${t}"><option value="">Sem assistência</option>${opts}</select>
      <button class="btn small" data-act="addGoal" data-mid="${m.id}" data-team="${t}">Registrar gol</button></div>`;
            };
            return `<div class="card"><div class="row between"><h3 style="margin:0">Partida ${i + 1}: ${teamLabel(m.home)} &nbsp;${hg} x ${ag}&nbsp; ${teamLabel(m.away)}</h3><span class="pill">${m.done ? 'Encerrada' : 'Em andamento'}</span></div>
    ${m.events.length ? `<ul class="list" style="margin-top:8px">${m.events.map((e, k) => `<li><span>${dot(e.team)}${esc(pname(e.scorer))}${e.assist ? ` <span class="note">&nbsp;assistência: ${esc(pname(e.assist))}</span>` : ''}</span>${m.done ? '' : `<button class="btn ghost small" data-act="delEvent" data-mid="${m.id}" data-idx="${k}">Remover</button>`}</li>`).join('')}</ul>` : '<p class="empty">Nenhum gol ainda.</p>'}
    ${m.done ? `<p class="note" style="margin-top:8px">${rotacaoTexto(m)}</p>` : goalForm(m.home) + goalForm(m.away)}
    <div class="row" style="margin-top:12px">
      ${m.done ? (canReopen(m, ms) ? `<button class="btn ghost small" data-act="reopen" data-mid="${m.id}">Reabrir</button>` : '') : `<button class="btn small" data-act="finish" data-mid="${m.id}">Encerrar partida</button>`}
      ${isLast ? `<button class="btn ghost small" data-act="delMatch" data-mid="${m.id}">Excluir partida</button>` : ''}
    </div></div>`;
        }

        function playersAdmin() {
            const ps = state.players.slice().sort((a, b) => (a.pos === b.pos ? 0 : a.pos === 'GK' ? -1 : 1) || a.name.localeCompare(b.name));
            return `<div class="card"><h3>Jogadores</h3>
    <form data-form="addPlayer" class="row" style="margin-bottom:8px"><input id="pName" placeholder="Nome" required>
      <select id="pPos"><option value="FIELD">Jogador de linha</option><option value="GK">Goleiro</option></select>
      <select id="pTeam">${TEAMS.map(t => `<option value="${t}">${NOME[t]}</option>`).join('')}</select><button class="btn">Adicionar</button></form>
    <p class="sub">O time só se aplica aos goleiros. Jogadores de linha são sempre sorteados.</p>
    ${ps.length ? `<div class="scroll"><table><thead><tr><th>Nome</th><th>Posição</th><th>Time</th><th>Situação</th><th></th></tr></thead><tbody>
    ${ps.map(p => `<tr><td>${esc(p.name)}</td><td>${p.pos === 'GK' ? 'Goleiro' : 'Linha'}</td>
      <td>${p.pos === 'GK' ? `<select data-chg="gkTeam" data-id="${p.id}">${TEAMS.map(t => `<option value="${t}" ${p.team === t ? 'selected' : ''}>${NOME[t]}</option>`).join('')}</select>` : '<span class="tag">Sorteio</span>'}</td>
      <td>${p.active ? 'Ativo' : '<span class="tag">Arquivado</span>'}</td>
      <td><div class="row" style="justify-content:flex-end"><button class="btn ghost small" data-act="rename" data-id="${p.id}">Renomear</button><button class="btn ghost small" data-act="toggleActive" data-id="${p.id}">${p.active ? 'Arquivar' : 'Restaurar'}</button><button class="btn ghost small" data-act="delPlayer" data-id="${p.id}">Excluir</button></div></td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">Nenhum jogador cadastrado.</p><button class="btn ghost small" data-act="sample">Adicionar jogadores de exemplo</button>'}
  </div>`;
        }

        function settingsAdmin() {
            const s = state.settings;
            const f = (id, label, val) => `<label class="field"><span>${label}</span><input id="${id}" type="number" min="1" value="${esc(val)}"></label>`;
            return `<div class="card"><h3>Configurações</h3><form data-form="settings"><div class="fields">
    ${f('sTeam', 'Jogadores de linha por time', s.teamSize)}
    ${f('sPair', 'Dias lembrados para evitar repetição de duplas', s.pairMemory)}
    ${f('sWin', 'Janela da lista de observação (jogos)', s.watchWindow)}
    ${f('sMin', 'Mínimo de jogos para estatísticas', s.minGames)}
    </div><p class="sub" style="margin:12px 0">Período aleatório: ${DIAS_ALEATORIO} dias (fixo). Depois disso, o sorteio balanceado é obrigatório.</p>
    <button class="btn">Salvar configurações</button></form></div>
    <div class="card"><h3>Dados</h3><p class="sub">Os dados ficam no Firebase e são sincronizados em tempo real para todos. Exporte periodicamente para ter um backup.</p>
    <div class="row"><button class="btn ghost" data-act="exportData">Exportar</button><label class="btn ghost">Importar<input type="file" accept=".json" data-chg="importData" hidden></label><button class="btn ghost" data-act="reset">Apagar todos os dados</button></div></div>`;
        }

        /* ========== Ações ========== */
        const somenteAdmin = new Set(['openDay', 'delDay', 'attAll', 'attNone', 'draw', 'addMatch', 'addGoal', 'delEvent', 'finish', 'reopen', 'leave', 'delMatch', 'rename', 'toggleActive', 'delPlayer', 'sample', 'reset']);

        const act = {
            theme() { aplicarTema(document.documentElement.dataset.theme === 'escuro' ? 'claro' : 'escuro'); },
            logout() { signOut(auth); openDay = null; },
            openDay(b) { openDay = b.dataset.id; render(); window.scrollTo(0, 0); },
            closeDay() { openDay = null; render(); },
            delDay(b) { if (!confirm('Excluir este dia de jogo?')) return; openDay = null; del('days', b.dataset.id); render(); },
            attAll() { const d = curDay(); d.attendees = state.players.filter(p => p.pos === 'FIELD' && p.active).map(p => p.id); put('days', d); },
            attNone() { const d = curDay(); d.attendees = []; put('days', d); },
            draw() {
                const day = curDay();
                const ids = day.attendees.filter(id => P(id) && P(id).pos === 'FIELD');
                if (ids.length < 3) { alert('Selecione pelo menos 3 jogadores de linha.'); return; }
                const gk = currentGKs(), mode = currentMode();
                day.teams = mode === 'balanced' ? balancedSplit(ids, day.id, gk) : deal(shuffle(ids.slice()));
                day.gk = gk; day.mode = mode;
                put('days', day);
            },
            addMatch() {
                const h = $('#mHome').value, a = $('#mAway').value;
                if (h === a) { alert('Escolha dois times diferentes.'); return; }
                put('matches', novaPartida(openDay, h, a));
            },
            addGoal(b) {
                const m = M(b.dataset.mid), t = b.dataset.team;
                const sc = $(`#sc-${m.id}-${t}`).value, as = $(`#as-${m.id}-${t}`).value;
                if (!sc) { alert('Selecione o autor do gol.'); return; }
                if (as === sc) { alert('O autor do gol e a assistência devem ser jogadores diferentes.'); return; }
                m.events.push({ team: t, scorer: sc, assist: as || null }); put('matches', m);
            },
            delEvent(b) { const m = M(b.dataset.mid); m.events.splice(+b.dataset.idx, 1); put('matches', m); },
            async finish(b) {
                const m = M(b.dataset.mid);
                const ms = dayMatches(m.dayId), isLast = ms[ms.length - 1].id === m.id;
                m.done = true;
                const p = plano(m);
                const ops = [['set', 'matches', m]];
                if (isLast && !p.tie) ops.push(['set', 'matches', novaPartida(m.dayId, p.stay, p.waiting)]);
                await lote(ops);
            },
            async reopen(b) {
                const m = M(b.dataset.mid), ms = dayMatches(m.dayId), next = ms[ms.findIndex(x => x.id === m.id) + 1];
                m.done = false;
                const ops = [['set', 'matches', m]];
                if (next) ops.push(['del', 'matches', next.id]);
                await lote(ops);
            },
            leave(b) {
                const m = M(b.dataset.mid), sai = b.dataset.team;
                const fica = sai === m.home ? m.away : m.home, entra = TEAMS.find(t => t !== m.home && t !== m.away);
                put('matches', novaPartida(m.dayId, fica, entra));
            },
            delMatch(b) { if (confirm('Excluir esta partida e seus gols?')) del('matches', b.dataset.mid); },
            rename(b) { const p = P(b.dataset.id), n = prompt('Novo nome', p.name); if (n && n.trim()) { p.name = n.trim(); put('players', p); } },
            toggleActive(b) { const p = P(b.dataset.id); p.active = !p.active; put('players', p); },
            delPlayer(b) {
                const id = b.dataset.id;
                const used = state.days.some(d => d.attendees.includes(id) || (d.teams && TEAMS.some(t => d.teams[t].includes(id))) || (d.gk && Object.values(d.gk).includes(id)))
                    || state.matches.some(m => m.events.some(e => e.scorer === id || e.assist === id));
                if (used) { alert('Este jogador possui histórico. Arquive-o para manter as estatísticas.'); return; }
                if (confirm('Excluir este jogador?')) del('players', id);
            },
            sample() {
                const ops = [];
                ['Lucas', 'Mateus', 'Gabriel', 'Rafael', 'Pedro', 'Felipe', 'Bruno', 'Thiago', 'Diego', 'Caio', 'Igor', 'Leandro', 'Renan', 'Vinicius', 'Marcos', 'Andre', 'Joao', 'Daniel']
                    .forEach(name => ops.push(['set', 'players', { id: uid(), name, pos: 'FIELD', team: null, active: true }]));
                [['Rodrigo', 'YELLOW'], ['Fabio', 'BLUE'], ['Henrique', 'RED']]
                    .forEach(([name, team]) => ops.push(['set', 'players', { id: uid(), name, pos: 'GK', team, active: true }]));
                lote(ops);
            },
            exportData() {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dia-de-jogo-' + todayStr() + '.json'; a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            },
            async reset() {
                if (!confirm('Apagar todos os jogadores, dias de jogo e estatísticas?') || !confirm('Esta ação não pode ser desfeita. Continuar?')) return;
                const ops = [];
                ['players', 'days', 'matches'].forEach(col => state[col].forEach(o => ops.push(['del', col, o.id])));
                ops.push(['set', 'config', { id: 'settings', ...PADRAO }]);
                openDay = null; await lote(ops);
            }
        };

        const chg = {
            att(el) {
                const d = curDay(), id = el.dataset.id;
                d.attendees = el.checked ? [...new Set([...d.attendees, id])] : d.attendees.filter(x => x !== id);
                $('#attCount').textContent = attText(d);
                put('days', d);
            },
            gkTeam(el) { if (!isAdmin) return; const p = P(el.dataset.id); p.team = el.value; put('players', p); },
            importData(el) {
                if (!isAdmin) return;
                const file = el.files[0]; if (!file) return;
                const r = new FileReader();
                r.onload = async () => {
                    try {
                        const d = JSON.parse(r.result);
                        if (!Array.isArray(d.players) || !Array.isArray(d.days) || !Array.isArray(d.matches)) throw 0;
                        if (!confirm('Importar este arquivo? Os registros com o mesmo identificador serão substituídos.')) return;
                        const ops = [];
                        ['players', 'days', 'matches'].forEach(col => d[col].forEach(o => ops.push(['set', col, o])));
                        const s = { ...PADRAO }; Object.keys(PADRAO).forEach(k => { if (d.settings && d.settings[k]) s[k] = d.settings[k]; });
                        ops.push(['set', 'config', { id: 'settings', ...s }]);
                        await lote(ops); alert('Dados importados.');
                    } catch (e) { alert('Arquivo inválido.'); }
                };
                r.readAsText(file);
            }
        };

        const frm = {
            login() {
                signInWithEmailAndPassword(auth, $('#lEmail').value.trim(), $('#lSenha').value)
                    .catch(() => { $('#loginErr').textContent = 'E-mail ou senha incorretos.'; });
            },
            addDay() {
                if (!isAdmin) return;
                const date = $('#dDate').value; if (!date) return;
                const d = { id: uid(), date, time: $('#dTime').value, place: $('#dPlace').value.trim(), attendees: [], teams: null, gk: null, mode: null };
                openDay = d.id; put('days', d); render();
            },
            addPlayer() {
                if (!isAdmin) return;
                const name = $('#pName').value.trim(); if (!name) return;
                if (state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { alert('Já existe um jogador com esse nome.'); return; }
                const pos = $('#pPos').value;
                put('players', { id: uid(), name, pos, team: pos === 'GK' ? $('#pTeam').value : null, active: true });
                setTimeout(() => $('#pName') && $('#pName').focus(), 50);
            },
            settings() {
                if (!isAdmin) return;
                const n = (id, min) => Math.max(min, parseInt($('#' + id).value, 10) || min);
                put('config', { id: 'settings', teamSize: n('sTeam', 1), pairMemory: n('sPair', 1), watchWindow: n('sWin', 2), minGames: n('sMin', 1) })
                    .then(() => alert('Configurações salvas.'));
            }
        };

        /* ========== Eventos e renderização ========== */
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-act],[data-view],[data-tab]'); if (!b) return;
            if (b.dataset.view) { view = b.dataset.view; openDay = null; render(); return; }
            if (b.dataset.tab) { rankTab = b.dataset.tab; render(); return; }
            const a = b.dataset.act;
            if (somenteAdmin.has(a) && !isAdmin) return;
            act[a] && act[a](b);
        });
        document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && chg[el.dataset.chg]) chg[el.dataset.chg](el); });
        document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.form; if (frm[f]) frm[f](e.target); });

        function render() {
            document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            if (loadError) { $('#app').innerHTML = `<div class="card"><h3>Erro ao carregar os dados</h3><p class="sub" style="margin:0">${esc(loadError)}. Verifique a configuração e as regras do Firestore.</p></div>`; return; }
            if (!Object.values(loaded).every(Boolean)) { $('#app').innerHTML = '<p class="empty">Carregando...</p>'; return; }
            $('#app').innerHTML = ({ teams: viewTeams, schedule: viewSchedule, rankings: viewRankings, watch: viewWatch, admin: viewAdmin })[view]();
        }
    </script>
</body>

</html>
